name: Idea / proposal
description: Share an idea that still needs discussion or design.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What would you like ha-dtek to support or do differently?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why would this be useful?
    validations:
      required: true
  - type: textarea
    id: design-notes
    attributes:
      label: Design notes
